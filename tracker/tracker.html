<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Nose Tracker Feed</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 20px;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .viewport {
      position: relative;
      width: 480px;
      height: 360px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror camera feed */
    }
    .panel {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 480px;
    }
    .status {
      font-weight: 600;
      font-size: 14px;
    }
    .info {
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <h2>Handsfree Nose Gaze Engine</h2>
  <div class="viewport">
    <video id="webcam" autoplay playsinline></video>
  </div>
  <div class="panel">
    <div id="status" class="status">Loading MediaPipe Face Landmarker...</div>
    <div id="metrics" class="info">Coords: (0.50, 0.50) | FPS: 0</div>
  </div>

  <script type="module" src="tracker.js"></script>
</body>
</html>
